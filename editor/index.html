<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>NCST Unified Text Editor</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="app">
      <aside id="drawer" class="drawer open">
        <button id="drawer-toggle" class="drawer-toggle" type="button" title="Collapse drawer">«</button>
        <nav class="rail" id="rail" aria-label="File and view"></nav>
      </aside>
      <div id="workspace">
        <div id="toolbar"></div>
        <div id="compose">
          <aside id="gutter" aria-label="Line type">
            <div id="gutter-marks"></div>
          </aside>
          <div id="compose-main">
            <div id="doc-header">
              <h2 id="doc-title" contenteditable="true" spellcheck="false" data-placeholder="Untitled"></h2>
            </div>
            <textarea id="editor" spellcheck="true" placeholder="Start writing…"></textarea>
            <div id="live" class="hidden"></div>
            <div id="preview" class="hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="ctx" class="ctx hidden" role="menu"></div>
    <div id="heading-menu" class="ctx hidden" role="menu">
      <button type="button" class="ctx-item" data-block="paragraph">Paragraph</button>
      <button type="button" class="ctx-item" data-block="h1">Heading 1</button>
      <button type="button" class="ctx-item" data-block="h2">Heading 2</button>
      <button type="button" class="ctx-item" data-block="h3">Heading 3</button>
      <button type="button" class="ctx-item" data-block="h4">Heading 4</button>
      <button type="button" class="ctx-item" data-block="h5">Heading 5</button>
      <button type="button" class="ctx-item" data-block="h6">Heading 6</button>
    </div>
    <script src="../node_modules/markdown-it/dist/markdown-it.min.js"></script>
    <script src="markdown.js"></script>
    <script src="format.js"></script>
    <script src="tools.js"></script>
    <script src="context-menu.js"></script>
    <script src="live-preview.bundle.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
