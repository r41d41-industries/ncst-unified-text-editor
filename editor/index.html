<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>NCST Unified Text Editor</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="app">
      <aside id="drawer" class="drawer open">
        <button id="drawer-toggle" class="drawer-toggle" type="button" title="Collapse drawer">«</button>
        <nav class="rail" aria-label="File and view">
          <button type="button" data-cmd="new" title="New">
            <span class="icon" aria-hidden="true">＋</span><span class="label">New</span>
          </button>
          <button type="button" data-cmd="open" title="Open">
            <span class="icon" aria-hidden="true">📂</span><span class="label">Open</span>
          </button>
          <button type="button" data-cmd="save" title="Save">
            <span class="icon" aria-hidden="true">💾</span><span class="label">Save</span>
          </button>
          <button type="button" data-cmd="saveAs" title="Save As">
            <span class="icon" aria-hidden="true">📄</span><span class="label">Save As</span>
          </button>
          <button type="button" id="btn-live" data-cmd="live" title="Live Preview">
            <span class="icon" aria-hidden="true">✎</span><span class="label">Live</span>
          </button>
          <button type="button" id="btn-preview" data-cmd="reading" title="Reading view">
            <span class="icon" aria-hidden="true">👁</span><span class="label">Reading</span>
          </button>
          <button type="button" id="btn-options" data-cmd="options" title="Options">
            <span class="icon" aria-hidden="true">⚙</span><span class="label">Options</span>
          </button>
        </nav>
        <section id="options-panel" class="hidden">
          <h2>Options</h2>
          <label><input id="opt-toolbar" type="checkbox" checked /> Show formatting bar</label>
          <button id="opt-customize-toolbar" type="button">Customize formatting bar…</button>
          <label><input id="opt-spell" type="checkbox" checked /> Spellcheck</label>
          <label for="opt-date">Date format</label>
          <input id="opt-date" type="text" value="MM/DD/YY" />
          <label for="opt-time">Time format</label>
          <input id="opt-time" type="text" value="h:mm A" />
          <label for="opt-combined">Combined format</label>
          <input id="opt-combined" type="text" value="{date} {time}" />
          <h2>Recent files</h2>
          <ul id="recent-files"></ul>
        </section>
      </aside>
      <div id="workspace">
        <div id="toolbar"></div>
        <div id="compose">
          <aside id="gutter" aria-label="Line type">
            <div id="gutter-marks"></div>
          </aside>
          <div id="compose-main">
            <textarea id="editor" spellcheck="true" placeholder="Start writing…"></textarea>
            <div id="live" class="hidden"></div>
            <div id="preview" class="hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="ctx" class="ctx hidden" role="menu"></div>
    <div id="heading-menu" class="ctx hidden" role="menu">
      <button type="button" class="ctx-item" data-block="paragraph">Paragraph</button>
      <button type="button" class="ctx-item" data-block="h1">Heading 1</button>
      <button type="button" class="ctx-item" data-block="h2">Heading 2</button>
      <button type="button" class="ctx-item" data-block="h3">Heading 3</button>
      <button type="button" class="ctx-item" data-block="h4">Heading 4</button>
      <button type="button" class="ctx-item" data-block="h5">Heading 5</button>
      <button type="button" class="ctx-item" data-block="h6">Heading 6</button>
    </div>
    <div id="toolbar-modal" class="modal hidden" role="dialog" aria-labelledby="toolbar-modal-title">
      <div class="modal-card">
        <header>
          <h2 id="toolbar-modal-title">Formatting toolbar</h2>
          <button id="toolbar-modal-close" type="button" title="Close">×</button>
        </header>
        <p class="modal-help">Check tools to show. Use arrows to reorder.</p>
        <ul id="toolbar-tool-list"></ul>
        <footer>
          <button id="toolbar-reset" type="button">Reset defaults</button>
          <button id="toolbar-done" type="button" class="accent">Done</button>
        </footer>
      </div>
    </div>
    <script src="../node_modules/markdown-it/dist/markdown-it.min.js"></script>
    <script src="markdown.js"></script>
    <script src="format.js"></script>
    <script src="tools.js"></script>
    <script src="context-menu.js"></script>
    <script src="live-preview.bundle.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
